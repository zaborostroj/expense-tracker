spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/auth_db
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:/config/liquibase/db.changelog-master.xml
    enabled: true
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
auth:
  internal:
    username: ${AUTH_INTERNAL_USER_NAME}
    password: ${AUTH_INTERNAL_PASSWORD}
server:
  port: 8081
